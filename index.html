<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">

<title>LevelUp</title>

<style>
:root{
  --bg:#f5f3ff;
  --card:#ffffff;
  --primary:#7c3aed;
  --primary-dark:#5b21b6;
  --text:#171717;
  --muted:#737373;
  --border:#e9e5f5;
  --green:#16a34a;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

/* HEADER */

.hero{
  background:linear-gradient(135deg,#7c3aed,#4c1d95);
  color:white;
  padding:28px 20px 34px;
  border-radius:0 0 30px 30px;
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.date{
  font-size:13px;
  opacity:.8;
}

.greeting{
  font-size:14px;
  opacity:.8;
  margin-bottom:5px;
}

.hero h1{
  font-size:30px;
  margin-bottom:7px;
}

.hero-sub{
  font-size:14px;
  opacity:.82;
}

/* MAIN */

main{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:18px;
  padding-bottom:100px;
}

/* PROGRESS */

.progress-card{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  margin-top:-5px;
  box-shadow:0 8px 25px rgba(76,29,149,.08);
}

.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.progress-title{
  font-weight:700;
}

.progress-percent{
  color:var(--primary);
  font-weight:800;
}

.progress-bar{
  width:100%;
  height:9px;
  background:#ede9fe;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7c3aed,#a855f7);
  border-radius:20px;
  transition:.3s;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}

.stat{
  background:var(--card);
  border-radius:18px;
  padding:15px 8px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.stat-icon{
  font-size:20px;
  margin-bottom:5px;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

/* ADD TASK */

.add-card{
  background:var(--card);
  border-radius:22px;
  padding:15px;
  margin-top:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

.add-row{
  display:flex;
  gap:8px;
}

#taskInput{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  background:#fafafa;
  padding:13px 14px;
  border-radius:14px;
  outline:none;
}

#taskInput:focus{
  border-color:#a78bfa;
}

.add-btn{
  background:var(--primary);
  color:white;
  padding:0 18px;
  border-radius:14px;
  font-weight:700;
}

/* SECTION */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:23px 2px 11px;
}

.section-head h2{
  font-size:19px;
}

.clear-btn{
  color:var(--primary);
  background:transparent;
  font-size:12px;
  font-weight:700;
}

/* FILTERS */

.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:11px;
}

.filter{
  background:white;
  color:#666;
  padding:8px 13px;
  border-radius:20px;
  white-space:nowrap;
  font-size:12px;
}

.filter.active{
  background:var(--primary);
  color:white;
}

/* TASKS */

.task{
  display:flex;
  align-items:center;
  gap:12px;
  background:white;
  padding:15px;
  border-radius:18px;
  margin-bottom:9px;
  box-shadow:0 4px 15px rgba(0,0,0,.035);
  transition:.2s;
}

.task.done{
  opacity:.55;
}

.check{
  width:25px;
  height:25px;
  min-width:25px;
  border-radius:50%;
  border:2px solid #c4b5fd;
  background:white;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:14px;
}

.task.done .check{
  background:var(--primary);
  border-color:var(--primary);
}

.task-info{
  flex:1;
  min-width:0;
}

.task-name{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.task-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.task.done .task-name{
  text-decoration:line-through;
}

.delete{
  background:#fef2f2;
  color:var(--red);
  width:32px;
  height:32px;
  border-radius:10px;
}

/* EMPTY */

.empty{
  background:white;
  padding:25px 15px;
  border-radius:18px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* DAILY LOG */

.log-card{
  background:white;
  border-radius:22px;
  padding:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.04);
}

#dailyLog{
  width:100%;
  min-height:120px;
  resize:vertical;
  border:1px solid var(--border);
  background:#fafafa;
  border-radius:14px;
  padding:13px;
  outline:none;
}

.save-log{
  width:100%;
  margin-top:9px;
  background:#ede9fe;
  color:var(--primary-dark);
  padding:12px;
  border-radius:13px;
  font-weight:700;
}

/* QUOTE */

.quote{
  margin-top:16px;
  background:linear-gradient(135deg,#ede9fe,#f5f3ff);
  color:#5b21b6;
  padding:17px;
  border-radius:20px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}

/* MOBILE */

@media(max-width:400px){

  main{
    padding:14px;
  }

  .hero{
    padding:24px 17px 30px;
  }

  .hero h1{
    font-size:27px;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:13px 5px;
  }

}
</style>
</head>

<body>

<header class="hero">

  <div class="hero-top">
    <div class="logo">⚡ LevelUp</div>
    <div class="date" id="todayDate"></div>
  </div>

  <div class="greeting">YOUR DAY</div>

  <h1>Lock in 👊</h1>

  <div class="hero-sub">
    Get your tasks done and level up.
  </div>

</header>


<main>

  <!-- PROGRESS -->

  <div class="progress-card">

    <div class="progress-top">
      <div class="progress-title">Today's Progress</div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">🎯</div>
      <strong id="totalCount">0</strong>
      <span>Tasks</span>
    </div>

    <div class="stat">
      <div class="stat-icon">✅</div>
      <strong id="completedCount">0</strong>
      <span>Done</span>
    </div>

    <div class="stat">
      <div class="stat-icon">🔥</div>
      <strong id="streakCount">0</strong>
      <span>Streak</span>
    </div>

  </div>


  <!-- ADD -->

  <div class="add-card">

    <div class="add-row">

      <input
        id="taskInput"
        type="text"
        placeholder="What needs to get done?"
        maxlength="120"
      >

      <button class="add-btn" onclick="addTask()">
        Add
      </button>

    </div>

  </div>


  <!-- TASKS -->

  <div class="section-head">

    <h2>Today's Tasks</h2>

    <button
      class="clear-btn"
      onclick="clearCompleted()"
    >
      Clear completed
    </button>

  </div>


  <div class="filters">

    <button
      class="filter active"
      onclick="setFilter('all',this)"
    >
      All
    </button>

    <button
      class="filter"
      onclick="setFilter('active',this)"
    >
      Active
    </button>

    <button
      class="filter"
      onclick="setFilter('done',this)"
    >
      Completed
    </button>

  </div>


  <div id="taskList"></div>


  <!-- DAILY LOG -->

  <div class="section-head">
    <h2>📝 Daily Log</h2>
  </div>

  <div class="log-card">

    <textarea
      id="dailyLog"
      placeholder="How was your day? What did you accomplish?"
    ></textarea>

    <button
      class="save-log"
      onclick="saveLog()"
    >
      Save Today's Log
    </button>

  </div>


  <!-- QUOTE -->

  <div class="quote" id="quote"></div>

</main>


<script>

let tasks =
  JSON.parse(
    localStorage.getItem("levelupTasks")
  ) || [];

let currentFilter = "all";


const quotes = [
  "Small progress is still progress.",
  "Lock in. You got this.",
  "One task at a time.",
  "Future you will thank you.",
  "Consistency beats motivation.",
  "Make today count.",
  "Start now. Thank yourself later.",
  "You don't need motivation. Just begin."
];


/* DATE */

function getToday(){

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );
}


function displayDate(){

  const d = new Date();

  document.getElementById("todayDate")
    .textContent =
      d.toLocaleDateString(
        undefined,
        {
          weekday:"short",
          day:"numeric",
          month:"short"
        }
      );
}


/* SAVE */

function saveTasks(){

  localStorage.setItem(
    "levelupTasks",
    JSON.stringify(tasks)
  );
}


/* ADD */

function addTask(){

  const input =
    document.getElementById("taskInput");

  const name =
    input.value.trim();

  if(!name) return;


  tasks.unshift({

    id:Date.now(),

    name:name,

    completed:false,

    date:getToday()

  });


  input.value="";

  saveTasks();

  render();
}


/* TOGGLE */

function toggleTask(id){

  const task =
    tasks.find(t => t.id === id);

  if(!task) return;

  task.completed =
    !task.completed;

  saveTasks();

  render();
}


/* DELETE */

function deleteTask(id){

  tasks =
    tasks.filter(
      t => t.id !== id
    );

  saveTasks();

  render();
}


/* CLEAR */

function clearCompleted(){

  tasks =
    tasks.filter(
      t => !t.completed
    );

  saveTasks();

  render();
}


/* FILTER */

function setFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(b =>
      b.classList.remove("active")
    );

  button.classList.add("active");

  render();
}


/* STREAK */

function updateStreak(){

  let streak =
    Number(
      localStorage.getItem(
        "levelupStreak"
      )
    ) || 0;


  const last =
    localStorage.getItem(
      "levelupLastCompleted"
    );


  const completedToday =
    tasks.some(
      t =>
        t.completed &&
        t.date === getToday()
    );


  if(
    completedToday &&
    last !== getToday()
  ){

    streak++;

    localStorage.setItem(
      "levelupStreak",
      streak
    );

    localStorage.setItem(
      "levelupLastCompleted",
      getToday()
    );

  }


  document.getElementById(
    "streakCount"
  ).textContent = streak;
}


/* STATS */

function updateStats(){

  const total =
    tasks.length;

  const completed =
    tasks.filter(
      t => t.completed
    ).length;


  const percent =
    total === 0
      ? 0
      : Math.round(
          (completed / total) * 100
        );


  document.getElementById(
    "totalCount"
  ).textContent = total;


  document.getElementById(
    "completedCount"
  ).textContent = completed;


  document.getElementById(
    "progressPercent"
  ).textContent =
    percent + "%";


  document.getElementById(
    "progressFill"
  ).style.width =
    percent + "%";


  updateStreak();
}


/* RENDER */

function render(){

  const list =
    document.getElementById(
      "taskList"
    );


  let visible =
    tasks;


  if(
    currentFilter === "active"
  ){

    visible =
      tasks.filter(
        t => !t.completed
      );

  }


  if(
    currentFilter === "done"
  ){

    visible =
      tasks.filter(
        t => t.completed
      );

  }


  if(visible.length === 0){

    list.innerHTML = `
      <div class="empty">
        ${
          currentFilter === "done"
            ? "No completed tasks yet 👀"
            : "Nothing here yet. Add a task above 👆"
        }
      </div>
    `;

  }else{

    list.innerHTML =
      visible.map(task => `

        <div class="task ${
          task.completed
            ? "done"
            : ""
        }">

          <button
            class="check"
            onclick="toggleTask(${task.id})"
          >
            ${
              task.completed
                ? "✓"
                : ""
            }
          </button>


          <div class="task-info">

            <div class="task-name">
              ${escapeHTML(task.name)}
            </div>

            <div class="task-meta">
              ${
                task.completed
                  ? "Completed ✓"
                  : "In progress"
              }
            </div>

          </div>


          <button
            class="delete"
            onclick="deleteTask(${task.id})"
          >
            🗑
          </button>

        </div>

      `).join("");

  }


  updateStats();
}


/* DAILY LOG */

function saveLog(){

  const text =
    document.getElementById(
      "dailyLog"
    ).value;


  localStorage.setItem(
    "levelupLog_" + getToday(),
    text
  );


  const button =
    document.querySelector(
      ".save-log"
    );


  button.textContent =
    "Saved ✓";


  setTimeout(() => {

    button.textContent =
      "Save Today's Log";

  },1500);
}


function loadLog(){

  const saved =
    localStorage.getItem(
      "levelupLog_" + getToday()
    );


  document.getElementById(
    "dailyLog"
  ).value =
    saved || "";
}


/* SECURITY */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;
}


/* ENTER TO ADD */

document
  .getElementById("taskInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        addTask();
      }

    }
  );


/* START */

displayDate();

loadLog();

document.getElementById("quote")
  .textContent =
    quotes[
      Math.floor(
        Math.random() *
        quotes.length
      )
    ];

render();

</script>

</body>
</html>
