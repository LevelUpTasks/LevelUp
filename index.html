<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="LevelUp To-Do">

  <title>LevelUp To-Do</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f5ff;
      color: #171717;
      min-height: 100vh;
    }

    header {
      background: #7c3aed;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      opacity: 0.85;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 18px;
      padding-bottom: 90px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: white;
      border-radius: 16px;
      padding: 15px 8px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: #7c3aed;
    }

    .stat span {
      font-size: 12px;
      color: #737373;
    }

    .add-box {
      background: white;
      padding: 15px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid #ddd6fe;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #7c3aed;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: bold;
    }

    .add-btn {
      background: #7c3aed;
      color: white;
      min-width: 70px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 10px;
    }

    .section-title h2 {
      font-size: 19px;
    }

    .clear-btn {
      background: transparent;
      color: #7c3aed;
      padding: 5px;
    }

    .task {
      background: white;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .task.done {
      opacity: .55;
    }

    .task.done .task-name {
      text-decoration: line-through;
    }

    .check {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border: 2px solid #a78bfa;
      border-radius: 50%;
      background: white;
      padding: 0;
    }

    .task.done .check {
      background: #7c3aed;
      border-color: #7c3aed;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-weight: bold;
      word-break: break-word;
    }

    .task-meta {
      font-size: 12px;
      color: #737373;
      margin-top: 4px;
    }

    .delete {
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 10px;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      color: #737373;
    }

    .log-box {
      background: white;
      padding: 15px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      margin-bottom: 10px;
    }

    .save-log {
      background: #7c3aed;
      color: white;
      width: 100%;
    }

    .quote {
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: #ede9fe;
      color: #5b21b6;
      text-align: center;
      font-weight: bold;
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .filter {
      background: white;
      color: #555;
      white-space: nowrap;
      padding: 9px 13px;
    }

    .filter.active {
      background: #7c3aed;
      color: white;
    }

    @media (max-width: 400px) {
      .stats {
        gap: 6px;
      }

      .stat {
        padding: 12px 5px;
      }

      .stat strong {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>⚡ LevelUp</h1>
    <p>Get things done. Level up your day.</p>
  </header>

  <main>

    <div class="stats">
      <div class="stat">
        <strong id="totalCount">0</strong>
        <span>Total</span>
      </div>

      <div class="stat">
        <strong id="completedCount">0</strong>
        <span>Completed</span>
      </div>

      <div class="stat">
        <strong id="streakCount">0</strong>
        <span>Day Streak 🔥</span>
      </div>
    </div>

    <div class="add-box">
      <div class="input-row">
        <input
          id="taskInput"
          type="text"
          placeholder="Add a task..."
          maxlength="120"
        >

        <button class="add-btn" onclick="addTask()">Add</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter active" onclick="setFilter('all', this)">All</button>
      <button class="filter" onclick="setFilter('active', this)">Active</button>
      <button class="filter" onclick="setFilter('done', this)">Done</button>
    </div>

    <div class="section-title">
      <h2>Today's Tasks</h2>
      <button class="clear-btn" onclick="clearCompleted()">Clear done</button>
    </div>

    <div id="taskList"></div>

    <div class="section-title">
      <h2>📝 Daily Log</h2>
    </div>

    <div class="log-box">
      <textarea
        id="dailyLog"
        placeholder="How was your day? What did you do?"
      ></textarea>

      <button class="save-log" onclick="saveLog()">
        Save Today's Log
      </button>
    </div>

    <div class="quote" id="quote">
      Small progress is still progress.
    </div>

  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem("levelupTasks")) || [];
    let currentFilter = "all";

    const quotes = [
      "Small progress is still progress.",
      "You don't need to be perfect. Just start.",
      "One task at a time.",
      "Future you will thank you.",
      "Lock in. You got this.",
      "Consistency beats motivation.",
      "Make today count."
    ];

    function saveTasks() {
      localStorage.setItem("levelupTasks", JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById("taskInput");
      const name = input.value.trim();

      if (!name) return;

      tasks.unshift({
        id: Date.now(),
        name: name,
        completed: false,
        date: getToday()
      });

      input.value = "";
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);

      if (!task) return;

      task.completed = !task.completed;

      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);

      saveTasks();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);

      saveTasks();
      render();
    }

    function setFilter(filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filter").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      render();
    }

    function getToday() {
      const now = new Date();

      return (
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0")
      );
    }

    function render() {
      const list = document.getElementById("taskList");

      let visibleTasks = tasks;

      if (currentFilter === "active") {
        visibleTasks = tasks.filter(t => !t.completed);
      }

      if (currentFilter === "done") {
        visibleTasks = tasks.filter(t => t.completed);
      }

      if (visibleTasks.length === 0) {
        list.innerHTML = `
          <div class="empty">
            ${
              currentFilter === "done"
                ? "No completed tasks yet 👀"
                : "No tasks here. Add one above 👆"
            }
          </div>
        `;
      } else {
        list.innerHTML = visibleTasks.map(task => `
          <div class="task ${task.completed ? "done" : ""}">

            <button
              class="check"
              onclick="toggleTask(${task.id})"
              aria-label="Complete task"
            >
              ${task.completed ? "✓" : ""}
            </button>

            <div class="task-info">
              <div class="task-name">${escapeHTML(task.name)}</div>
              <div class="task-meta">
                ${task.completed ? "Completed ✓" : "Not completed"}
              </div>
            </div>

            <button
              class="delete"
              onclick="deleteTask(${task.id})"
              aria-label="Delete task"
            >
              🗑
            </button>

          </div>
        `).join("");
      }

      updateStats();
    }

    function updateStats() {
      const completed = tasks.filter(t => t.completed).length;

      document.getElementById("totalCount").textContent = tasks.length;
      document.getElementById("completedCount").textContent = completed;

      calculateStreak();
    }

    function calculateStreak() {
      let streak = Number(localStorage.getItem("levelupStreak")) || 0;
      const lastDate = localStorage.getItem("levelupLastCompleted");

      const hasCompletedToday = tasks.some(
        task => task.completed && task.date === getToday()
      );

      if (hasCompletedToday && lastDate !== getToday()) {
        streak++;
        localStorage.setItem("levelupStreak", streak);
        localStorage.setItem("levelupLastCompleted", getToday());
      }

      document.getElementById("streakCount").textContent = streak;
    }

    function saveLog() {
      const log = document.getElementById("dailyLog").value;

      localStorage.setItem(
        "levelupLog_" + getToday(),
        log
      );

      alert("✅ Daily log saved!");
    }

    function loadLog() {
      const saved = localStorage.getItem(
        "levelupLog_" + getToday()
      );

      document.getElementById("dailyLog").value = saved || "";
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById("taskInput").addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          addTask();
        }
      }
    );

    document.getElementById("quote").textContent =
      quotes[Math.floor(Math.random() * quotes.length)];

    loadLog();
    render();
  </script>

</body>
</html>
